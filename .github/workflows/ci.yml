name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  soroban:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts/soroban
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: rustup show
      - name: Test contracts
        run: cargo test --workspace --lib --locked
      - uses: stellar/stellar-cli@v30.0.1
      - name: Build Wasm
        run: stellar contract build --locked
